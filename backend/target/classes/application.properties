spring.application.name=sharetable

# PostgreSQL
# On macOS Homebrew, the default user is often your system username (not "postgres").
# Override with: SPRING_DATASOURCE_USERNAME=yourname SPRING_DATASOURCE_PASSWORD=yourpass
spring.datasource.url=jdbc:postgresql://localhost:5432/sharetable
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
